<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Full-Stack App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
    }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background: #7dd3fc;
    }
    #response {
      margin-top: 15px;
      color: #4ade80;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>My Full-Stack App</h1>
    <p>Click below to fetch data live from your Express backend server.</p>
    <button id="fetchBtn">Ping Backend API</button>
    <div id="response">Waiting for request...</div>
  </div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const responseEl = document.getElementById('response');
      responseEl.innerText = 'Fetching...';

      try {
        const res = await fetch('/api/message');
        const data = await res.json();
        responseEl.innerText = data.message;
      } catch (err) {
        responseEl.innerText = 'Failed to connect to backend.';
      }
    });
  </script>

</body>
</html>
<a href="/api/fitbit/auth">
    <button style="padding: 10px 20px; background: #00B0B9; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Connect Fitbit / Google Health
    </button>
</a>
